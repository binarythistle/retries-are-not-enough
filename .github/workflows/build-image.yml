# Builds the Instruqt sandbox image and publishes it to GHCR.
#
# Runs on ubuntu-latest, which is native linux/amd64. That matters: Instruqt
# sandboxes are amd64, and an image built on an Apple Silicon Mac is arm64 and
# will not start there.
#
# Auth is the built-in GITHUB_TOKEN, scoped by `permissions: packages: write`
# below. No PAT and no repo secret to create. The image lands in this account's
# package namespace.
#
# Two tags every run:
#   :latest      moving, tracks main. Fine while authoring.
#   :<sha>       immutable. Pin the Instruqt sandbox to one of these before a
#                live session so a merge cannot change the image mid-workshop.
#
# NOTE: the first successful run creates the package as PRIVATE. Flip it to
# public once, by hand, or Instruqt's anonymous pull is denied:
#   Profile -> Packages -> retries-are-not-enough-sandbox -> Package settings
#   -> Danger Zone -> Change visibility -> Public
name: Build sandbox image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "recordings/**"
      - "tickets/**"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

env:
  # GHCR namespaces must be lowercase.
  IMAGE: ghcr.io/binarythistle/retries-are-not-enough-sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          # Keep the published manifest a plain single-platform image. The
          # default attestation manifest is harmless on GHCR but buys nothing
          # here, and a simpler manifest is one less thing for Instruqt's
          # puller to disagree with.
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the pinnable tag
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          {
            echo "### Sandbox image published"
            echo '```'
            echo "${IMAGE}:${GITHUB_SHA}"
            echo '```'
            echo "Paste that into the Instruqt sandbox Image field to pin it."
          } >> "$GITHUB_STEP_SUMMARY"
